<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Admin — JAVA ISLAND TRIP</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><style>body{background:#f5f8f4}.admin-shell{max-width:1240px;margin:auto;padding:35px 24px 60px}.admin-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.admin-top .brand{background:#fff;padding:10px 14px;border-radius:15px}.admin-layout{display:grid;grid-template-columns:220px 1fr;gap:22px}.admin-sidebar{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;height:max-content;position:sticky;top:25px}.admin-tab{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 13px;border-radius:10px;color:var(--muted);font-weight:600;font-size:13px}.admin-tab.active,.admin-tab:hover{background:var(--mist);color:var(--green)}.admin-content{min-width:0}.admin-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px}.admin-card h2{font-size:27px;margin-bottom:4px}.admin-card>p{color:var(--muted);font-size:13px}.admin-table{width:100%;border-collapse:collapse;font-size:13px}.admin-table th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:10px 9px;border-bottom:1px solid var(--line)}.admin-table td{padding:13px 9px;border-bottom:1px solid #eff3ef;vertical-align:middle}.status{background:#fff5d9;color:#9a7214;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700}.status.ok{background:#e3f3e4;color:var(--green)}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}.small-btn{border:1px solid var(--line);background:#fff;color:var(--green);border-radius:8px;padding:7px 10px;font-size:11px;font-weight:700}.small-btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.admin-grid .full{grid-column:1/-1}.image-input{font-size:12px}.admin-note{padding:14px 16px;background:var(--mist);border-radius:12px;color:#416549;font-size:12px;margin-bottom:18px}.login{max-width:430px;margin:10vh auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:var(--shadow)}@media(max-width:760px){.admin-layout{grid-template-columns:1fr}.admin-sidebar{position:static;display:flex;overflow:auto;gap:6px}.admin-tab{white-space:nowrap}.admin-grid{grid-template-columns:1fr}.admin-grid .full{grid-column:auto}.admin-table{min-width:660px}.admin-table-wrap{overflow:auto}}
</style></head><body><div id="adminApp"></div><script src="admin.js"></script></body></html>
